<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0" />
  <title>地产大亨 — 局域网联机</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎲</text></svg>">
  <link rel="stylesheet" href="/style.css?v=38" />
</head>
<body>
  <!-- 断线重连遮罩 -->
  <div id="reconnect-mask" class="reconnect-mask hidden">
    <div class="reconnect-card">
      <div class="spinner"></div>
      <div>连接断开，正在重连…</div>
    </div>
  </div>

  <!-- ========== 大堂（创建/加入房间） ========== -->
  <div id="lobby" class="screen active">
    <div class="lobby-wrap">
      <div class="lobby-card">
        <h1 class="lobby-title">
          <span class="logo-text">地产大亨</span>
          <button id="btn-toggle-help" class="btn-ghost-icon" title="游戏说明">?</button>
        </h1>
        <p class="lobby-sub">局域网联机版</p>

        <label>昵称</label>
        <input id="lobby-name" type="text" maxlength="12" placeholder="你的昵称" />

        <label>头像</label>
        <div id="create-avatar" class="picker" data-name="avatar"></div>

        <label>棋子颜色</label>
        <div id="create-pawn" class="picker pawn-picker" data-name="pawn"></div>

        <div class="lobby-actions">
          <button id="btn-create" class="btn btn-primary">🏠 创建房间</button>
          <div class="join-row">
            <input id="join-code" type="text" maxlength="5" placeholder="房间码" />
            <button id="btn-join" class="btn">加入</button>
          </div>
        </div>

        <div id="lobby-status" class="lobby-status"></div>
      </div>

      <div class="lobby-settings">
        <h3>游戏设置（房主可调）</h3>
        <div class="setting-row"><span class="setting-label">💰 起始资金</span>
          <div class="radio-group" id="startingMoney-group">
            <label><input type="radio" name="startingMoney" value="5000"><span>5,000（困难）</span></label>
            <label><input type="radio" name="startingMoney" value="8000" checked><span>8,000（标准）</span></label>
            <label><input type="radio" name="startingMoney" value="12000"><span>12,000（丰富）</span></label>
            <label><input type="radio" name="startingMoney" value="15000"><span>15,000（豪华）</span></label>
          </div>
        </div>
        <div class="setting-row"><span class="setting-label">🏁 GO 奖金</span>
          <div class="radio-group">
            <label><input type="radio" name="goBonus" value="1500"><span>1,500</span></label>
            <label><input type="radio" name="goBonus" value="2000" checked><span>2,000</span></label>
            <label><input type="radio" name="goBonus" value="3000"><span>3,000</span></label>
          </div>
        </div>
        <div class="setting-row"><span class="setting-label">🔒 监狱费</span>
          <div class="radio-group">
            <label><input type="radio" name="jailFine" value="500"><span>500</span></label>
            <label><input type="radio" name="jailFine" value="1000" checked><span>1,000</span></label>
            <label><input type="radio" name="jailFine" value="2000"><span>2,000</span></label>
          </div>
        </div>
        <p class="hint">设置在创建房间时生效；地图价格、租金、卡牌金额等会按 <b>起始资金 / 8000</b> 等比缩放。</p>
      </div>
    </div>
  </div>

  <!-- ========== 等待大厅 ========== -->
  <div id="waiting" class="screen">
    <div class="waiting-wrap">
      <div class="room-code-card">
        <div class="room-code-label">房间号</div>
        <div class="room-code-row">
          <code id="wait-code" class="code">——</code>
          <button id="btn-copy-code" class="btn btn-tiny">📋 复制</button>
        </div>
        <div class="wait-hint">把房间号发给朋友，让他们加入</div>
      </div>
      <div class="wait-card">
        <h3>👥 玩家（<span id="wait-count">0</span>）</h3>
        <ul id="wait-players" class="player-list compact"></ul>
        <div class="wait-rules" id="wait-rules"></div>
        <button id="btn-start" class="btn btn-primary hidden">▶ 开始游戏</button>
        <div class="wait-back"><button id="btn-leave-wait" class="btn btn-ghost btn-tiny">← 返回大堂</button></div>
      </div>
    </div>
  </div>

  <!-- ========== 游戏区 ========== -->
  <div id="game" class="screen">
    <!-- 顶部状态栏 -->
    <div class="game-top">
      <div class="status-block">
        <code id="game-code" class="code">——</code>
        <button id="btn-copy-code2" class="btn-ghost btn-tiny">📋</button>
      </div>
      <div id="status" class="status">加载中…</div>
      <!-- 倒计时进度条(时长与服务端超时同步,剩最后 1/3 变红) -->
      <div class="turn-timer"><div id="turn-timer-bar" class="turn-timer-bar"></div></div>
    </div>

    <!-- 玩家头像条(点 chip 查看该玩家资产/发起交易) -->
    <div id="player-chips" class="player-chips"></div>

    <!-- 主体分栏:棋盘(主区) + 操作面板(右侧竖排;≤720px 时变贴底横排) -->
    <div class="game-body">
      <!-- 棋盘 -->
      <div class="board-wrap">
        <div id="board" class="board"></div>
        <!-- 骰子居中浮在 board 中央 -->
        <div class="dice-bar">
          <div id="dice" class="dice" aria-hidden="true">
            <div class="die" id="die1">—</div>
            <div class="die" id="die2">—</div>
          </div>
          <div id="dice-info" class="dice-info hidden">
            <div id="dice-total" class="dice-total"></div>
            <div id="dice-bonus" class="dice-bonus hidden">✨ 双！</div>
          </div>
          <!-- 自由停车奖池角标 -->
          <div id="pot-badge" class="pot-badge hidden"></div>
        </div>
      </div>

      <!-- 操作面板 -->
      <div id="action-dock" class="action-dock"></div>
    </div>

    <!-- 日志抽屉(左) -->
    <div id="drawer-log" class="drawer drawer-left">
      <div class="drawer-head"><h3>📜 日志</h3><button class="drawer-close" data-close="drawer-log">×</button></div>
      <ul id="log" class="log-list"></ul>
    </div>
    <!-- 聊天抽屉(右) -->
    <div id="drawer-chat" class="drawer drawer-right">
      <div class="drawer-head"><h3>💬 聊天</h3><button class="drawer-close" data-close="drawer-chat">×</button></div>
      <ul id="chat" class="chat-list"></ul>
      <!-- 快捷表情行(按钮由 JS 生成) -->
      <div id="emote-row" class="emote-row"></div>
      <div class="chat-input-row">
        <input id="chat-input" type="text" maxlength="100" placeholder="说点什么… (Enter 发送)" />
        <button id="btn-chat" class="btn btn-tiny">发送</button>
      </div>
    </div>
    <!-- 抽屉开关浮钮 -->
    <button id="btn-drawer-log" class="drawer-fab drawer-fab-left" title="日志">📜</button>
    <button id="btn-drawer-chat" class="drawer-fab drawer-fab-right" title="聊天">💬<span id="chat-unread" class="unread-dot hidden"></span></button>
    <!-- 音效开关 -->
    <button id="btn-sound" class="sound-fab" title="音效开关">🔊</button>

    <!-- 通知横幅（租金/破产/交易/获胜） -->
    <div id="banner-root"></div>

    <!-- 模态弹窗根 -->
    <div id="modal-root"></div>
  </div>

  <!-- ========== 声音 ========== -->
  <script src="/socket.io/socket.io.js?v=38"></script>
  <script src="/game.js?v=38"></script>
</body>
</html>
